<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1600" viewBox="0 0 2100 1600" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">OODA 本体模型概念关系图</title>
  <desc id="description">应用领域隔离本体定义、对象实例及决策数据，用户先选择有权访问的领域。每种概念只出现一次。定义关系连接 Interface、共享属性、对象类型、普通属性、只读计算属性、关系类型和决策类型。对象变化使自动化检查条件；自动化可引用独立定义的触发规则，并可调用独立定义的 Action；决策案例的 Orient 快照会冻结适用触发规则的判断，也可调用 Action。Action 校验后修改对象实例。对象实例关联关系实例、证据和决策案例。关系类型约束基数与自环许可，自环默认禁止；计算结果在读取时产生，不写入实例。</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#f0f5ff"/></linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#5579c5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#245fe0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#16866c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#b2762c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172b4d; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 17px; fill: #526580; }
      .section-title { font-size: 22px; font-weight: 700; }
      .node-title { font-size: 21px; font-weight: 700; }
      .node-sub { font-size: 14px; fill: #526580; }
      .node rect { fill: #fff; stroke-width: 1.8; }
      .node-def rect { stroke: #a9c3f3; }
      .node-logic rect { stroke: #a7d8c8; }
      .node-runtime rect { stroke: #e8c793; }
      .node-compute rect { stroke: #3c72e2; stroke-width: 2.2; }
      .edge { fill: none; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .edge-def { stroke: #5579c5; marker-end: url(#arrow-blue); }
      .edge-compute { stroke: #245fe0; stroke-width: 3.3; marker-end: url(#arrow-compute); }
      .edge-logic { stroke: #16866c; marker-end: url(#arrow-green); }
      .edge-runtime { stroke: #b2762c; marker-end: url(#arrow-amber); }
      .edge-label { font-size: 14px; font-weight: 700; fill: #344b6e; }
      .note { font-size: 14px; fill: #526580; }
    </style>
  </defs>

  <rect width="2100" height="1600" fill="url(#background)"/>
  <text class="title" x="62" y="68">OODA 本体模型 · 概念关系</text>
  <text class="subtitle" x="64" y="105">每种概念只出现一次；箭头表示触发、引用、调用或实例化关系，蓝色强调只读计算路径。</text>
  <g id="node-application-domain" class="node node-def">
    <rect x="64" y="119" width="1170" height="39" rx="12" fill="#fff" stroke="#a9c3f3"/>
    <text class="node-sub" x="83" y="145">应用领域：管理员创建并授权成员；当前领域自动附加 domain_id，隔离下方定义与运行数据</text>
  </g>
  <circle cx="1510" cy="94" r="7" fill="#5579c5"/><text class="note" x="1526" y="100">定义</text>
  <circle cx="1610" cy="94" r="7" fill="#16866c"/><text class="note" x="1626" y="100">逻辑</text>
  <circle cx="1710" cy="94" r="7" fill="#b2762c"/><text class="note" x="1726" y="100">运行</text>
  <circle cx="1810" cy="94" r="7" fill="#245fe0"/><text class="note" x="1826" y="100">计算读取</text>

  <rect x="48" y="170" width="2004" height="730" rx="24" fill="#f5f8ff" stroke="#dce6f9"/>
  <rect x="48" y="1040" width="2004" height="500" rx="24" fill="#fff8ed" stroke="#f1e4ce"/>
  <text class="section-title" x="77" y="214">建模、计算与执行</text>
  <text class="section-title" x="77" y="1082">运行实例与决策</text>

  <!-- 连线位于节点下层。每条边标明起点与终点，便于核对关系。 -->
  <g>
    <path class="edge edge-def" data-from="shared-property" data-to="property" d="M340 405 H410"/><text class="edge-label" x="360" y="391">引用</text>
    <path class="edge edge-def" data-from="property" data-to="computed-property" d="M680 405 H850"/><text class="edge-label" x="724" y="391">作为输入</text>
    <path class="edge edge-compute" data-from="function" data-to="computed-property" d="M1320 355 V295 H990 V355"/><text class="edge-label" x="1100" y="281">函数求值</text>
    <path class="edge edge-logic" data-from="rule" data-to="function" d="M1510 405 H1450"/><text class="edge-label" x="1457" y="391">可调用</text>
    <path class="edge edge-logic" data-from="automation" data-to="rule" d="M1930 355 V260 H1630 V355"/><text class="edge-label" x="1736" y="246">可引用触发规则</text>
    <path class="edge edge-logic" data-from="rule" data-to="decision-case" d="M1630 455 V950 H1580 V1350 H1100 V1410"/><text class="edge-label" x="1305" y="1337">快照冻结规则判断</text>
    <path class="edge edge-logic" data-from="automation" data-to="action" d="M1930 455 V735"/><text class="edge-label" x="1950" y="606">可调用 Action</text>

    <path class="edge edge-def" data-from="interface" data-to="object-type" d="M340 785 H410"/><text class="edge-label" x="360" y="771">实现</text>
    <path class="edge edge-def" data-from="object-type" data-to="property" d="M545 735 V455"/><text class="edge-label" x="565" y="606">定义属性</text>
    <path class="edge edge-def" data-from="object-type" data-to="object-instance" d="M680 785 H850"/><text class="edge-label" x="737" y="771">实例化</text>
    <path class="edge edge-compute" data-from="computed-property" data-to="object-instance" d="M990 455 V735"/><text class="edge-label" x="1011" y="606">读取时附加结果</text>
    <path class="edge edge-logic" data-from="object-instance" data-to="automation" d="M1130 755 H1150 V520 H1790 V405 H1810"/><text class="edge-label" x="1215" y="506">对象变化触发条件检查</text>
    <path class="edge edge-logic" data-from="action" data-to="object-instance" d="M1810 785 H1130"/><text class="edge-label" x="1430" y="771">修改实例</text>

    <path class="edge edge-def" data-from="link-type" data-to="link-instance" d="M340 1180 H410"/><text class="edge-label" x="360" y="1166">约束</text>
    <path class="edge edge-runtime" data-from="object-instance" data-to="link-instance" d="M900 835 V980 H720 V1180 H680"/><text class="edge-label" x="750" y="966">参与连接</text>
    <path class="edge edge-runtime" data-from="object-instance" data-to="evidence" d="M1080 835 V1000 H1355 V1130"/><text class="edge-label" x="1181" y="986">附着证据</text>
    <path class="edge edge-runtime" data-from="object-instance" data-to="decision-case" d="M990 835 V1410"/><text class="edge-label" x="1012" y="1337">作为决策上下文</text>
    <path class="edge edge-def" data-from="decision-type" data-to="decision-case" d="M680 1460 H850"/><text class="edge-label" x="734" y="1446">定义流程</text>
    <path class="edge edge-logic" data-from="decision-case" data-to="action" d="M1170 1460 H1930 V835"/><text class="edge-label" x="1730" y="1446">决策执行可调用</text>
  </g>

  <!-- 定义层：每个概念对应一个节点。 -->
  <g id="node-shared-property" class="node node-def" transform="translate(70 355)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">共享属性</text><text class="node-sub" x="20" y="72">可被多个类型引用的定义</text>
  </g>
  <g id="node-property" class="node node-def" transform="translate(410 355)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">普通属性</text><text class="node-sub" x="20" y="72">实例中存储的原始业务值</text>
  </g>
  <g id="node-computed-property" class="node node-compute" transform="translate(850 355)">
    <rect width="280" height="100" rx="15"/><text class="node-title" x="20" y="41">只读计算属性</text><text class="node-sub" x="20" y="72">输入属性 → 函数 → 输出类型</text>
  </g>
  <g id="node-interface" class="node node-def" transform="translate(70 735)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">Interface</text><text class="node-sub" x="20" y="72">类型必须满足的属性契约</text>
  </g>
  <g id="node-object-type" class="node node-def" transform="translate(410 735)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">对象类型</text><text class="node-sub" x="20" y="72">属性集合、分类与实现的接口</text>
  </g>
  <g id="node-link-type" class="node node-def" transform="translate(70 1130)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">关系 Link 类型</text><text class="node-sub" x="20" y="72">约束两端类型、基数与自环许可</text>
  </g>
  <g id="node-decision-type" class="node node-def" transform="translate(410 1410)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">决策类型</text><text class="node-sub" x="20" y="72">定义案例的目标、准则与约束</text>
  </g>

  <!-- 逻辑层 -->
  <g id="node-function" class="node node-logic" transform="translate(1190 355)">
    <rect width="260" height="100" rx="15"/><text class="node-title" x="20" y="41">函数 Function</text><text class="node-sub" x="20" y="72">可复用的表达式计算</text>
  </g>
  <g id="node-rule" class="node node-logic" transform="translate(1510 355)">
    <rect width="240" height="100" rx="15"/><text class="node-title" x="20" y="41">规则 Rule</text><text class="node-sub" x="20" y="72">指标、约束、触发与评分</text><text class="node-sub" x="20" y="90">独立定义，可被引用</text>
  </g>
  <g id="node-automation" class="node node-logic" transform="translate(1810 355)">
    <rect width="240" height="100" rx="15"/><text class="node-title" x="20" y="41">自动化</text><text class="node-sub" x="20" y="72">对象类型、条件与效果</text><text class="node-sub" x="20" y="90">当前监听对象变化</text>
  </g>
  <g id="node-action" class="node node-logic" transform="translate(1810 735)">
    <rect width="240" height="100" rx="15"/><text class="node-title" x="20" y="41">Action</text><text class="node-sub" x="20" y="72">校验后受控写入</text><text class="node-sub" x="20" y="90">独立定义，可由人工调用</text>
  </g>

  <!-- 运行层 -->
  <g id="node-object-instance" class="node node-runtime" transform="translate(850 735)">
    <rect width="280" height="100" rx="15"/><text class="node-title" x="20" y="41">对象实例</text><text class="node-sub" x="20" y="72">保存属性；读取时显示计算值</text>
  </g>
  <g id="node-link-instance" class="node node-runtime" transform="translate(410 1130)">
    <rect width="270" height="100" rx="15"/><text class="node-title" x="20" y="41">关系实例</text><text class="node-sub" x="20" y="72">连接两个实例；自环默认禁止</text>
  </g>
  <g id="node-evidence" class="node node-runtime" transform="translate(1190 1130)">
    <rect width="330" height="100" rx="15"/><text class="node-title" x="20" y="41">证据 / 来源记录</text><text class="node-sub" x="20" y="72">支撑对象事实与追溯</text>
  </g>
  <g id="node-decision-case" class="node node-runtime" transform="translate(850 1410)">
    <rect width="320" height="100" rx="15"/><text class="node-title" x="20" y="41">决策案例</text><text class="node-sub" x="20" y="72">冻结事实、关系与规则提示</text>
  </g>

  <rect x="54" y="1537" width="1992" height="49" rx="8" fill="#e5ecf8"/>
  <text class="note" x="76" y="1556">示例：出生日期 → 周岁函数（按业务时区取今天）→ 年龄；计算结果不入库，下次读取重新计算。</text>
  <text class="note" x="76" y="1577">战场态势：军机 → 机场/装备，军舰 → 港口/装备；活动事件 → 军机/军舰/区域，舰载机事件 → 航母；情报报告 → 活动事件。</text>
</svg>
